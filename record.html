<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل يومي – Tahfidh Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets_icons/appicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets_icons/appicon-64.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

<header class="app-header">
  <button class="menu-btn" onclick="history.back()">←</button>
  <div style="text-align:center;">
    <div class="app-title" data-i18n="takeRecord">تسجيل يومي</div>
    <div id="studentNameDisplay" style="font-size:0.85rem; opacity:0.9;"></div>
  </div>
  <div style="display:flex; gap:4px;">
    <button id="langToggle" class="lang-switcher" onclick="toggleLang(); location.reload();">🌐</button>
    <button id="darkToggle" class="lang-switcher" onclick="toggleDarkMode()"><img src="icons/day time icon.svg" style="width:20px; height:20px; filter:brightness(0) invert(1);" alt=""></button>
  </div>
</header>

<main class="main-content">

  <!-- Date picker -->
  <section class="card">
    <label class="form-label" style="display:block; font-weight:800; margin-bottom:8px;" data-i18n="selectDate">اختر التاريخ</label>
    <input type="date" id="recordDate" class="form-input" />
  </section>

  <!-- Attendance -->
  <section class="card">
    <div style="font-weight:800; margin-bottom:10px;" data-i18n="attendance">الحضور</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="attPresent" class="btn btn-secondary" style="flex:1; min-width:calc(50% - 8px);" onclick="setAtt('present')" data-i18n="present">حاضر</button>
      <button id="attAbsent"  class="btn btn-secondary" style="flex:1; min-width:calc(50% - 8px);" onclick="setAtt('absent')"  data-i18n="absent">غائب</button>
      <button id="attLate"    class="btn btn-secondary" style="flex:1; min-width:calc(50% - 8px);" onclick="setAtt('late')"    data-i18n="lateLabel">متأخر</button>
      <button id="attExcused" class="btn btn-secondary" style="flex:1; min-width:calc(50% - 8px);" onclick="setAtt('excused')" data-i18n="excused">معذور</button>
    </div>
  </section>

  <!-- Course-specific section (rendered by records.js) -->
  <div id="courseSection"></div>

  <!-- Teacher Comments — always visible regardless of attendance -->
  <section class="card" style="border:2px solid var(--primary);">
    <div style="font-size:1.05rem; font-weight:900; margin-bottom:10px; color:var(--primary);">
      <img src="icons/comments icon.svg" style="width:20px;height:20px;vertical-align:middle;margin-left:4px;margin-right:4px;"> <span data-i18n="teacherNotes">ملاحظات المعلم</span>
    </div>
    <textarea id="teacherComments" class="form-input" rows="3"
      placeholder="اكتب ملاحظاتك هنا..."></textarea>
  </section>

  <!-- Save -->
  <section class="card">
    <button id="btnSave" class="btn btn-success btn-full" style="font-size:1.1rem; padding:0.9rem;" data-i18n="saveRecord">حفظ سجل اليوم</button>
  </section>

</main>

<footer class="branding-footer" data-i18n="footer">Made by Al Hudaa Program | صُنع بواسطة برنامج الهدى</footer>

<script src="js/js/db.js"></script>
<script src="js/js/i18n.js"></script>
<script src="js/js/ui.js"></script>
<script src="js/js/records.js"></script>
</body>
</html>
