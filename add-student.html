<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>إضافة طالب – Tahfidh Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets_icons/appicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets_icons/appicon-64.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

<header class="app-header">
  <button class="menu-btn" onclick="history.back()">←</button>
  <div class="app-title" id="pageTitle" data-i18n="addStudent">إضافة طالب</div>
  <div style="display:flex; gap:4px;">
    <button id="langToggle" class="lang-switcher" onclick="toggleLang(); location.reload();">🌐</button>
    <button id="darkToggle" class="lang-switcher" onclick="toggleDarkMode()"><img src="icons/day time icon.svg" style="width:20px; height:20px; filter:brightness(0) invert(1);" alt=""></button>
  </div>
</header>

<main class="main-content">
  <section class="card">
    <div class="form-group">
      <label class="form-label" data-i18n="studentNameLabel">اسم الطالب *</label>
      <input id="studentName" class="form-input" data-i18n-ph="studentNamePh" placeholder="الاسم الكامل" required />
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="gender">الجنس</label>
      <div style="display:flex; gap:10px;">
        <button type="button" id="genderMale" class="btn btn-primary" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:0.6rem;" onclick="selectStudentGender('male')">
          <img src="icons/male teacher icon.svg" style="width:24px; height:24px; filter:brightness(0) invert(1);" alt="">
          <span data-i18n="male">ذكر</span>
        </button>
        <button type="button" id="genderFemale" class="btn btn-secondary" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:0.6rem;" onclick="selectStudentGender('female')">
          <img src="icons/female teacher icon.svg" style="width:24px; height:24px;" alt="">
          <span data-i18n="female">أنثى</span>
        </button>
      </div>
      <input type="hidden" id="gender" value="ذكر" />
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="studentPhotoLabel">صورة الطالب (اختياري)</label>
      <div style="display:flex; align-items:center; gap:14px; margin-top:6px;">
        <img id="studentPhotoPreview" src="icons/male teacher icon.svg" alt=""
          style="width:64px; height:64px; border-radius:50%; object-fit:cover; border:2px solid var(--border); background:var(--bg); flex-shrink:0;" />
        <div style="display:flex; flex-direction:column; gap:8px; flex:1;">
          <label class="btn btn-secondary" for="studentPhotoInput"
            style="cursor:pointer; padding:0.4rem 1rem; font-size:0.85rem; text-align:center; display:block; margin:0;"
            data-i18n="uploadPhoto">رفع صورة</label>
          <input type="file" id="studentPhotoInput" accept="image/*" style="display:none;"
            onchange="handleStudentPhoto(this)" />
          <button type="button" id="studentPhotoClearBtn" class="btn" onclick="clearStudentPhoto()"
            style="display:none; padding:0.4rem 1rem; font-size:0.85rem; background:#FEE2E2; color:#DC2626; margin:0;"
            data-i18n="removePhoto">حذف الصورة</button>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="courseLabel">المسار</label>
      <select id="course" class="form-input form-select">
        <option value="hifdh"    data-i18n="courseHifdh">حفظ</option>
        <option value="talqin"   data-i18n="courseTalqin">تلقين</option>
        <option value="murajaah" data-i18n="courseMurajaah">مراجعة</option>
        <option value="qaida"    data-i18n="courseQaida">القاعدة</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="phoneRequired">رقم الهاتف (ولي الأمر) *</label>
      <input id="phone" class="form-input" type="tel" placeholder="+966..." required />
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="lastSurah">آخر سورة محفوظة</label>
      <div id="lastSurahWrap"></div>
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="examJuzCount">عدد أجزاء الاختبار</label>
      <input id="examJuz" class="form-input" type="number" min="0" data-i18n-ph="examJuzPh" placeholder="مثال: 3" />
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="examPercentage">نسبة الاختبار %</label>
      <input id="examPercent" class="form-input" type="number" min="0" max="100" data-i18n-ph="examPercentPh" placeholder="مثال: 85" />
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="examNotes">ملاحظات الاختبار</label>
      <textarea id="examNotes" class="form-input" rows="3" data-i18n-ph="examNotesPh" placeholder="ملاحظات عن أداء الطالب في الاختبار..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="notesOptional">ملاحظات (اختياري)</label>
      <textarea id="notes" class="form-input" rows="3" data-i18n-ph="notesPh" placeholder="أي معلومات إضافية..."></textarea>
    </div>

    <!-- Fee Section -->
    <div id="studentFeeSection" style="display:none; border-top:2px solid var(--border); padding-top:16px; margin-top:8px;">
      <div style="font-size:0.95rem; font-weight:800; margin-bottom:12px; color:var(--primary);">
        <img src="icons/fee icon.svg" style="width:18px;height:18px;vertical-align:middle;margin-left:6px;"> إعدادات الرسوم
      </div>
      <div class="form-group">
        <label class="form-label">تاريخ بدء الرسوم</label>
        <input id="feeStartMonth" class="form-input" type="month" />
      </div>
      <div class="form-group">
        <label class="form-label" id="feeAmountLabel">مبلغ الرسوم لهذا الطالب</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input id="feeAmount" class="form-input" type="number" min="0" placeholder="0" style="flex:1;" />
          <span id="feeCurrencyLabel" style="font-weight:700; color:var(--text-muted); min-width:40px;"></span>
        </div>
      </div>
    </div>

    <button id="btnSave" class="btn btn-success btn-full" style="font-size:1.05rem; padding:0.85rem; margin-top:6px;" data-i18n="saveStudent">
      حفظ الطالب
    </button>
    <button id="btnDelete" class="btn btn-full" style="background:#FEE2E2; color:#DC2626; margin-top:10px; display:none; gap:8px;">
      <img src="icons/delete icon.svg" style="width:18px; height:18px;" alt="">
      <span data-i18n="deleteStudent">حذف الطالب</span>
    </button>
  </section>
</main>

<footer class="branding-footer" data-i18n="footer">Made by Al Hudaa Program | صُنع بواسطة برنامج الهدى</footer>

<script src="js/js/db.js"></script>
<script src="js/js/i18n.js"></script>
<script src="js/js/ui.js"></script>
<script src="js/js/add-student.js"></script>
</body>
</html>
