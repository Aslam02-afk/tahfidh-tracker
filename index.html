<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0D2C54" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>متتبع التحفيظ | Tahfidh Tracker</title>
  <!-- Preload critical resources to speed up app load (reduces Android splash time) -->
  <link rel="preload" href="css/style.css" as="style" />
  <link rel="preload" href="js/js/db.js" as="script" />
  <link rel="preload" href="js/js/home.js" as="script" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets_icons/appicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets_icons/appicon-64.png" />
  <link rel="apple-touch-icon" href="assets_icons/appicon-192.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <!-- ══════════════════════════════════════
       SPLASH SCREEN
  ══════════════════════════════════════ -->
  <div id="splashScreen" style="display:none;">
    <img class="splash-logo" src="assets_icons/appicon.svg" alt="Tahfidh Tracker" />
    <div class="splash-arabic">متتبع التحفيظ</div>
    <div class="splash-english">Tahfidh Tracker</div>
    <div class="splash-divider"></div>
    <div class="splash-welcome">أهلاً بك في متتبع التحفيظ</div>
    <div class="splash-loader">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
    <div class="splash-dev">Developed by Al Hudaa Program</div>
  </div>

  <!-- ══════════════════════════════════════
       MAIN APP
  ══════════════════════════════════════ -->
  <header class="app-header">
    <button id="langToggle" class="lang-switcher" onclick="toggleLang(); if(typeof renderClasses==='function') renderClasses();">🌐</button>
    <div style="text-align:center;">
      <div class="app-title" data-i18n="appTitle">متتبع التحفيظ</div>
      <div style="font-size:0.75rem; opacity:0.85;" data-i18n="appSub">نظام إدارة التحفيظ</div>
    </div>
    <button id="darkToggle" class="lang-switcher" onclick="toggleDarkMode()">
      <img src="icons/day time icon.svg" style="width:20px; height:20px; filter:brightness(0) invert(1);" alt="">
    </button>
  </header>

  <main class="main-content">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:0.8rem 1rem; margin-bottom:0.5rem;">
      <div style="text-align:center; flex:1;">
        <div style="font-size:0.72rem; color:var(--text-muted);" data-i18n="hijriDate">التاريخ الهجري</div>
        <div id="hijriDate" style="font-size:0.9rem; font-weight:700; margin-top:2px;"></div>
      </div>
      <div style="width:1px; height:30px; background:var(--border);"></div>
      <div style="text-align:center; flex:1;">
        <div style="font-size:0.72rem; color:var(--text-muted);" data-i18n="gregorianDate">التاريخ الميلادي</div>
        <div id="gregorianDate" style="font-size:0.9rem; font-weight:700; margin-top:2px;"></div>
      </div>
    </div>

    <h2 style="margin-bottom:16px; font-size:1rem; color:var(--text-muted);" data-i18n="classes">الحلقات</h2>
    <div id="classesContainer"></div>
    <button class="btn btn-success btn-full" onclick="goToAddClass()" style="margin-top:4px; padding:0.85rem; font-size:1rem; display:flex; align-items:center; justify-content:center; gap:8px;">
      <img src="icons/add icon.svg" style="width:20px; height:20px; filter:brightness(0) invert(1);" alt="">
      <span data-i18n="addNewClass">إضافة حلقة جديدة</span>
    </button>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active">
      <div class="nav-icon"><img src="icons/home icon.svg" alt=""></div>
      <div class="nav-text" data-i18n="home">الرئيسية</div>
    </button>
    <button class="nav-btn" onclick="location.href='quran.html'">
      <div class="nav-icon"><img src="icons/Quran icon.svg" alt=""></div>
      <div class="nav-text" data-i18n="quran">القرآن</div>
    </button>
    <button class="nav-btn" onclick="location.href='settings.html'">
      <div class="nav-icon"><img src="icons/setting icon.svg" alt=""></div>
      <div class="nav-text" data-i18n="settings">الإعدادات</div>
    </button>
  </nav>

  <footer class="branding-footer" data-i18n="footer">Made by Al Hudaa Program | صُنع بواسطة برنامج الهدى</footer>

  <script src="js/js/db.js"></script>
  <script src="js/js/i18n.js"></script>
  <script src="js/js/ui.js"></script>
  <script src="js/js/home.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    // ── Backup reminder on home load ──────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
      checkBackupReminder();
    });

    // ── Splash screen — show once per session ─────────────────────────────
    (function () {
      const splash = document.getElementById('splashScreen');
      if (!splash) return;

      if (sessionStorage.getItem('splashShown')) {
        splash.style.display = 'none';
        return;
      }

      // First visit — show splash
      splash.style.display = 'flex';
      sessionStorage.setItem('splashShown', '1');

      // "Developed by Al Hudaa Program" = 30 chars
      // typing starts at 1000ms, ~55ms per char = ~1650ms to finish
      // + 1000ms pause after typing = total ~3650ms before fade
      // We use 4500ms to give comfortable margin
      const SPLASH_DURATION = 4500;  // ms — enough for full typing + pause
      const FADE_DURATION   = 650;   // ms — fade out

      setTimeout(function () {
        splash.classList.add('hide');
        setTimeout(function () {
          splash.style.display = 'none';
        }, FADE_DURATION);
      }, SPLASH_DURATION);
    })();
  </script>
</body>
</html>
