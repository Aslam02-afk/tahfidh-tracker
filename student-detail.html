<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>بيانات الطالب – Tahfidh Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets_icons/appicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets_icons/appicon-64.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

<header class="app-header">
  <button class="menu-btn" onclick="history.back()">←</button>
  <div class="app-title" data-i18n="studentDetail">بيانات الطالب</div>
  <div style="display:flex; gap:4px;">
    <button id="langToggle" class="lang-switcher" onclick="toggleLang(); location.reload();">🌐</button>
    <button id="darkToggle" class="lang-switcher" onclick="toggleDarkMode()"><img src="icons/day time icon.svg" style="width:20px; height:20px; filter:brightness(0) invert(1);" alt=""></button>
  </div>
</header>

<main class="main-content">
  <div id="studentDetailContainer"></div>
</main>

<!-- Report Format Modal -->
<div id="reportFmtModal" class="tt-modal" onclick="if(event.target===this) closeReportFmtModal()">
  <div class="tt-modal-box" style="max-width:340px;">
    <h3 style="margin:0 0 16px; font-size:1.05rem;" data-i18n="reportFmtTitle">اختر صيغة التقرير</h3>
    <div style="display:flex; flex-direction:column; gap:10px;">

      <button class="btn btn-primary btn-full" style="padding:0.85rem; font-size:1rem; display:flex; align-items:center; justify-content:center; gap:10px;"
        onclick="submitReportFormat('pdf')">
        <img src="icons/printer icon.svg" style="width:24px; height:24px; filter:brightness(0) invert(1);" alt="">
        <span data-i18n="reportFmtPdf">PDF احترافي</span>
      </button>

      <button class="btn btn-secondary btn-full" style="padding:0.85rem; font-size:1rem; display:flex; align-items:center; justify-content:center; gap:10px;"
        onclick="submitReportFormat('img')">
        <img src="icons/image icon.svg" style="width:24px; height:24px; filter:brightness(0) invert(1);" alt="">
        <span data-i18n="reportFmtImg">صورة للمشاركة</span>
      </button>

      <button class="btn btn-secondary btn-full" style="padding:0.85rem; font-size:1rem; display:flex; align-items:center; justify-content:center; gap:10px;"
        onclick="submitReportFormat('msg')">
        <img src="icons/whatsapp icon.svg" style="width:24px; height:24px; filter:brightness(0) invert(1);" alt="">
        <span data-i18n="reportFmtMsg">رسالة واتساب</span>
      </button>

      <button class="btn btn-full" style="padding:0.7rem; font-size:0.9rem; background:#F3F4F6; color:#374151;"
        onclick="closeReportFmtModal()" data-i18n="cancel">إلغاء</button>
    </div>
  </div>
</div>

<footer class="branding-footer" data-i18n="footer">Made by Al Hudaa Program | صُنع بواسطة برنامج الهدى</footer>

<script src="js/js/db.js"></script>
<script src="js/js/i18n.js"></script>
<script src="js/js/ui.js"></script>
<script src="js/js/reports.js"></script>
<script src="js/js/student-detail.js"></script>
</body>
</html>
