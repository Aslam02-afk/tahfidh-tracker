<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>التواصل مع برنامج الهدى</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets_icons/appicon-64.png" />
  <link rel="manifest" href="manifest.json" />
</head>

<body>

  <header class="app-header">
    <button class="menu-btn" onclick="history.back()">←</button>
    <div style="text-align:center;">
      <div class="app-title">Tahfidh Tracker</div>
      <div class="app-subtitle" data-i18n="contactAlHudaa">التواصل مع برنامج الهدى</div>
    </div>
    <div style="display:flex; gap:4px;">
      <button id="langToggle" class="lang-switcher" onclick="toggleLang(); location.reload();">🌐</button>
      <button id="darkToggle" class="lang-switcher" onclick="toggleDarkMode()"><img src="icons/day time icon.svg"
          style="width:20px; height:20px; filter:brightness(0) invert(1);" alt=""></button>
    </div>
  </header>

  <main class="main-content">

    <section class="card">
      <h3 style="margin-bottom:8px;" data-i18n="contactUsTitle">تواصل معنا</h3>
      <p style="color:var(--text-muted); line-height:1.7;" data-i18n="contactUsDesc">
        إذا كان لديك اقتراح، مشكلة تقنية، أو طلب خاص، يسعدنا تواصلك مع برنامج الهدى.
      </p>
    </section>

    <section class="card">
      <div class="form-group">
        <label class="form-label" data-i18n="teacherNameOptional">اسم المعلم (اختياري)</label>
        <input id="teacherName" class="form-input" data-i18n-ph="teacherNameContactPh" placeholder="اكتب اسمك" />
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="contactEmailLabel">البريد الإلكتروني للرد عليك</label>
        <input id="userEmail" type="email" class="form-input" data-i18n-ph="contactEmailPh" placeholder="example@email.com" dir="ltr" required />
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="subject">الموضوع</label>
        <select id="subject" class="form-select">
          <option data-i18n="subjectSuggestion">اقتراح تطوير</option>
          <option data-i18n="subjectBug">مشكلة تقنية</option>
          <option data-i18n="subjectDataInquiry">استفسار عن البيانات</option>
          <option data-i18n="subjectSupport">طلب دعم</option>
          <option data-i18n="subjectOther">أخرى</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="message">الرسالة</label>
        <textarea id="message" class="form-input" rows="5" data-i18n-ph="messagePh"
          placeholder="اكتب رسالتك هنا..."></textarea>
      </div>

      <button id="sendBtn" class="btn btn-primary btn-full" onclick="sendMessage()" data-i18n="sendMessage">
        إرسال الرسالة
      </button>
    </section>

    <section class="card" style="text-align:center;">
      <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.6;" data-i18n="contactDirectNote">
        سيتم إرسال رسالتك مباشرة إلى فريق التطبيق، وسنرد عليك عبر بريدك الإلكتروني.
      </p>
      <p style="font-size:0.85rem; margin-top:6px;">
        <b>markazalhudaa143@gmail.com</b>
      </p>
    </section>

  </main>

  <footer class="branding-footer" data-i18n="footer">
    Made by Al Hudaa Program | صُنع بواسطة برنامج الهدى
  </footer>

  <script src="js/db.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script>
    async function sendMessage() {
      const name = document.getElementById("teacherName").value.trim() || t('notMentioned');
      const email = document.getElementById("userEmail").value.trim();
      const subject = document.getElementById("subject").value;
      const message = document.getElementById("message").value.trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        alert(t('invalidEmail'));
        document.getElementById("userEmail").focus();
        return;
      }

      if (!message) {
        alert(t('pleaseWriteMessage'));
        document.getElementById("message").focus();
        return;
      }

      const btn = document.getElementById("sendBtn");
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = t('contactSending');

      try {
        const res = await fetch('/api/send-contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            subject,
            message,
            timestamp: new Date().toLocaleString(getLang() === 'ar' ? 'ar-SA' : 'en-GB', { timeZone: 'Asia/Riyadh' })
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Failed to send');
        }

        alert(t('contactSentSuccess'));
        document.getElementById("message").value = '';
      } catch (err) {
        console.error('Contact error:', err);
        const shouldFallback = confirm(
          t('contactSendError') + '\n\n' +
          (getLang() === 'ar' ? 'هل تود فتح تطبيق البريد لإرسالها كبديل؟' : 'Would you like to open your email client as fallback?')
        );
        if (shouldFallback) {
          const mailSubject = encodeURIComponent("Tahfidh Tracker – " + subject);
          const body = encodeURIComponent(
            t('teacherNameEmail') + ": " + name + "\n" +
            "Email: " + email + "\n\n" +
            t('messageEmail') + ":\n" + message + "\n\n" +
            "— " + t('sentFromApp')
          );
          window.location.href = "mailto:markazalhudaa143@gmail.com?subject=" + mailSubject + "&body=" + body;
        }
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "71f9ed97099f494188baa74934972078"}'></script><!-- End Cloudflare Web Analytics -->
</body>

</html>
