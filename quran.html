<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0D2C54" />
  <title>القرآن الكريم – Tahfidh Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets_icons/appicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <style>

    /* ═══════════════════════════════════════════
       MUSHAF MADANI DIGITAL — Page Layout
    ═══════════════════════════════════════════ */

    :root {
      --mushaf-bg:      #FBF6E9;
      --mushaf-border:  #C9A24D;
      --mushaf-text:    #1A1A1A;
      --mushaf-muted:   #7A6A50;
      --mushaf-header:  #0D2C54;
      --mushaf-frame:   #C9A24D;
      --ayah-marker:    #C9A24D;
      --basmalah-color: #0D2C54;
    }

    html.dark {
      --mushaf-bg:     #000000;
      --mushaf-border: #C9A24D;
      --mushaf-text:   #FFFFFF;
      --mushaf-muted:  #A89070;
      --mushaf-header: #C9A24D;
      --basmalah-color:#C9A24D;
    }

    body {
      background: var(--bg, #F4F6F8);
      animation: none;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    html.dark body { background: #000000; }

    /* ── App header ── */
    .quran-app-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    /* ── Page navigator ── */
    .page-nav {
      background: var(--primary, #0D2C54);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      position: sticky;
      top: 52px;
      z-index: 199;
      gap: 8px;
    }

    html.dark .page-nav { background: #0D2C54; }

    .page-nav-btn {
      background: rgba(201,162,77,0.15);
      border: 1px solid var(--mushaf-border);
      color: var(--mushaf-border);
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      min-width: 44px;
    }

    .page-nav-btn:active {
      background: rgba(201,162,77,0.3);
      transform: scale(0.94);
    }

    .page-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-number-display {
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      flex: 1;
      cursor: pointer;
    }

    .page-number-display span {
      color: var(--mushaf-border);
      font-size: 1rem;
    }

    /* ── Go-to-page input ── */
    .goto-bar {
      display: none;
      background: var(--primary, #0D2C54);
      padding: 8px 14px;
      gap: 8px;
      align-items: center;
    }

    .goto-bar.show { display: flex; }

    .goto-bar input {
      flex: 1;
      background: rgba(255,255,255,0.12);
      border: 1px solid var(--mushaf-border);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .goto-bar button {
      background: var(--mushaf-border);
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* ── Main scroll area ── */
    .mushaf-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      padding-bottom: 5rem;
    }

    /* ── Mushaf page ── */
    .mushaf-page {
      background: var(--mushaf-bg);
      border-radius: 4px;
      border: 1.5px solid var(--mushaf-border);
      box-shadow:
        0 0 0 6px rgba(201,162,77,0.08),
        0 8px 32px rgba(0,0,0,0.5);
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* Decorative corner ornaments */
    .mushaf-page::before,
    .mushaf-page::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--mushaf-border);
      border-style: solid;
      opacity: 0.6;
    }

    .mushaf-page::before {
      top: 6px;
      right: 6px;
      border-width: 2px 2px 0 0;
      border-radius: 0 4px 0 0;
    }

    .mushaf-page::after {
      top: 6px;
      left: 6px;
      border-width: 2px 0 0 2px;
      border-radius: 4px 0 0 0;
    }

    .mushaf-page-inner {
      padding: 20px 18px 16px;
      position: relative;
    }

    /* Bottom corner ornaments via JS-injected divs */
    .corner-bl, .corner-br {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--mushaf-border);
      border-style: solid;
      opacity: 0.6;
      bottom: 6px;
    }

    .corner-bl {
      left: 6px;
      border-width: 0 0 2px 2px;
      border-radius: 0 0 0 4px;
    }

    .corner-br {
      right: 6px;
      border-width: 0 2px 2px 0;
      border-radius: 0 0 4px 0;
    }

    /* ── Page header (Juz + Surah info) ── */
    .mushaf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 10px;
      border-bottom: 1px solid rgba(201,162,77,0.3);
      margin-bottom: 12px;
      font-size: 0.72rem;
      color: var(--mushaf-muted);
      font-weight: 700;
      direction: rtl;
    }

    .mushaf-header .hizb {
      color: var(--mushaf-border);
      font-size: 0.8rem;
    }

    /* ── Surah name frame ── */
    .surah-frame {
      text-align: center;
      margin: 10px 0 6px;
      position: relative;
    }

    .surah-frame-inner {
      display: inline-block;
      border: 1.5px solid var(--mushaf-frame);
      border-radius: 6px;
      padding: 6px 24px;
      position: relative;
      background: rgba(201,162,77,0.05);
    }

    /* Side ornaments on surah frame */
    .surah-frame-inner::before,
    .surah-frame-inner::after {
      content: '❧';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mushaf-frame);
      font-size: 1rem;
      opacity: 0.7;
    }

    .surah-frame-inner::before { right: 6px; }
    .surah-frame-inner::after  { left: 6px; transform: translateY(-50%) scaleX(-1); }

    .surah-name {
      font-family: 'KFGQPC Hafs', serif;
      font-size: 1.1rem;
      color: var(--mushaf-header);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .surah-info-small {
      font-size: 0.65rem;
      color: var(--mushaf-muted);
      margin-top: 2px;
    }

    /* ── Basmalah ── */
    .basmalah {
      text-align: center;
      font-family: 'KFGQPC Hafs', serif;
      font-size: 1.3rem;
      color: var(--basmalah-color);
      margin: 8px 0 10px;
      letter-spacing: 1px;
      line-height: 1.8;
    }

    html.dark .basmalah { color: var(--mushaf-border); }

    /* ── Quran text lines ── */
    .mushaf-lines {
      direction: rtl;
    }

    .mushaf-line {
      font-family: 'KFGQPC Hafs', serif;
      font-size: 1.22rem;
      line-height: 2.1;
      color: var(--mushaf-text);
      text-align: justify;
      text-align-last: center;
      width: 100%;
      display: block;
    }

    /* Ayah number marker */
    .ayah-marker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ayah-marker);
      font-family: 'KFGQPC Hafs', serif;
      font-size: 0.85rem;
      vertical-align: middle;
      margin: 0 1px;
    }

    /* Surah Al-Fatiha / Al-Ikhlas centered */
    .mushaf-line.center {
      text-align: center;
      text-align-last: center;
    }

    /* ── Page footer ── */
    .mushaf-footer {
      text-align: center;
      padding: 8px 4px 0;
      border-top: 1px solid rgba(201,162,77,0.3);
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--mushaf-muted);
      font-weight: 700;
      direction: ltr;
    }

    /* ── Loading state ── */
    .mushaf-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 16px;
      color: var(--mushaf-border);
    }

    .mushaf-loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mushaf-border);
      display: inline-block;
      animation: splashDot 1.2s ease-in-out infinite;
      margin: 0 3px;
    }

    .mushaf-loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .mushaf-loading-dot:nth-child(3) { animation-delay: 0.4s; }

    /* ── Swipe hint ── */
    .swipe-hint {
      text-align: center;
      color: rgba(201,162,77,0.5);
      font-size: 0.7rem;
      padding: 8px;
      letter-spacing: 1px;
    }

    /* ── Page transition ── */
    .mushaf-page {
      animation: pageAppear 0.3s ease both;
    }

    @keyframes pageAppear {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Surah selector modal ── */
    .surah-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 9000;
      display: none;
      align-items: flex-end;
      backdrop-filter: blur(3px);
    }

    .surah-modal.show { display: flex; }

    .surah-modal-box {
      background: var(--card-bg);
      width: 100%;
      max-height: 70vh;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1) both;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .surah-modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
    }

    .surah-modal-search {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .surah-modal-search input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
    }

    .surah-modal-list {
      overflow-y: auto;
      flex: 1;
    }

    .surah-modal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .surah-modal-item:active { background: rgba(13,44,84,0.08); }

    .surah-modal-item .snum {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .surah-modal-item .sname {
      font-weight: 700;
      font-size: 1rem;
      flex: 1;
      padding: 0 10px;
      direction: rtl;
    }

    .surah-modal-item .spage {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── Surah / Juz Selector Bar ── */
    .selector-bar {
      display: flex;
      align-items: center;
      background: var(--secondary, #0F766E);
      padding: 8px 12px;
      gap: 0;
      border-bottom: 1px solid rgba(201,162,77,0.3);
    }

    html.dark .selector-bar { background: #0F766E; }

    .selector-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      color: #fff;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .selector-btn:active { background: rgba(255,255,255,0.25); }

    .selector-divider {
      width: 10px;
      flex-shrink: 0;
    }

    .selector-current {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
      max-width: 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

  </style>
</head>
<body>

<!-- App Header -->
<header class="quran-app-header">
  <button class="menu-btn" onclick="history.back()">←</button>
  <div style="text-align:center;">
    <div class="app-title">القرآن الكريم</div>
  </div>
  <div style="display:flex;gap:6px;">
    <button class="menu-btn" onclick="toggleDarkMode()">
      <img src="icons/day time icon.svg" id="darkToggle" style="width:18px;height:18px;filter:brightness(0) invert(1);" alt="">
    </button>
  </div>
</header>

<!-- Page Navigator -->
<div class="page-nav">
  <button class="page-nav-btn" id="btnPrev" onclick="goPage(currentPage - 1, -1)">›</button>
  <div class="page-number-display" onclick="toggleGoto()">
    صفحة <span id="pageNum">1</span> <span style="color:#888;font-size:0.75rem;">/ 604</span>
  </div>
  <button class="page-nav-btn" id="btnNext" onclick="goPage(currentPage + 1, 1)">‹</button>
</div>

<!-- Go To Page Bar -->
<div class="goto-bar" id="gotoBar">
  <input type="number" id="gotoInput" min="1" max="604" placeholder="رقم الصفحة (1-604)"
    onkeydown="if(event.key==='Enter') doGoto()" />
  <button onclick="doGoto()">اذهب</button>
</div>

<!-- Surah / Juz Selector Bar -->
<div class="selector-bar">
  <button class="selector-btn" onclick="openSurahModal()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>سورة</span>
    <span id="currentSurahLabel" class="selector-current"></span>
  </button>
  <div class="selector-divider"></div>
  <button class="selector-btn" onclick="openJuzModal()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>الجزء</span>
    <span id="currentJuzLabel" class="selector-current"></span>
  </button>
</div>

<!-- Mushaf Scroll Area -->
<div class="mushaf-scroll" id="mushafScroll">
  <div class="mushaf-loading" id="loadingState">
    <div style="color:var(--mushaf-border);font-size:0.9rem;margin-bottom:8px;">جاري تحميل المصحف...</div>
    <div>
      <span class="mushaf-loading-dot"></span>
      <span class="mushaf-loading-dot"></span>
      <span class="mushaf-loading-dot"></span>
    </div>
  </div>
  <div id="mushafPage" style="display:none;"></div>
  <div class="swipe-hint">← اسحب للتنقل بين الصفحات →</div>
</div>

<!-- Surah Selector Modal -->
<div class="surah-modal" id="surahModal" onclick="if(event.target===this) closeSurahModal()">
  <div class="surah-modal-box">
    <div class="surah-modal-header">
      <span style="font-weight:800;">اختر سورة</span>
      <button onclick="closeSurahModal()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:1rem;">✕</button>
    </div>
    <div class="surah-modal-search">
      <input type="text" id="surahSearch" placeholder="ابحث عن سورة..." oninput="filterSurahs(this.value)" />
    </div>
    <div class="surah-modal-list" id="surahList"></div>
  </div>
</div>

<!-- Juz Selector Modal -->
<div class="surah-modal" id="juzModal" onclick="if(event.target===this) closeJuzModal()">
  <div class="surah-modal-box">
    <div class="surah-modal-header">
      <span style="font-weight:800;">اختر الجزء</span>
      <button onclick="closeJuzModal()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:1rem;">✕</button>
    </div>
    <div class="surah-modal-search">
      <input type="text" id="juzSearch" placeholder="ابحث عن جزء..." oninput="filterJuz(this.value)" />
    </div>
    <div class="surah-modal-list" id="juzList"></div>
  </div>
</div>

<script src="js/js/db.js"></script>
<script src="js/js/i18n.js"></script>
<script src="js/js/ui.js"></script>
<script src="js/js/quran.js"></script>
</body>
</html>
