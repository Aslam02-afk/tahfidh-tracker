<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D2D53" />
  <title>القرآن الكريم – Tahfidh Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="assets_icons/appicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <style>
    /* ═══════════════════════════════════════════
       MUSHAF MADANI DIGITAL — Page Layout
    ═══════════════════════════════════════════ */

    :root {
      --mushaf-bg: #F4EDE5;
      --mushaf-border: #D4C7B8;
      --mushaf-text: #2C2B26;
      --mushaf-muted: #78716C;
      --mushaf-header: #0D2D53;
      --mushaf-frame: #529B88;
      --ayah-marker: #529B88;
      --basmalah-color: #2C2B26;
    }

    html.dark {
      --mushaf-bg: #18181B;
      --mushaf-border: #3F3F46;
      --mushaf-text: #F4F4F5;
      --mushaf-muted: #A1A1AA;
      --mushaf-header: #E4E4E7;
      --mushaf-frame: #5EEAD4;
      --ayah-marker: #5EEAD4;
      --basmalah-color: #F4F4F5;
    }

    body {
      background: var(--mushaf-bg);
      color: var(--mushaf-text);
      animation: none;
    }

    html.dark body {
      background: var(--mushaf-bg);
    }

    /* ── App header ── */
    .quran-app-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    @media (min-width: 641px) {
      .quran-app-header {
        max-width: 640px;
        margin-inline: auto;
        border-radius: 0 0 16px 16px;
      }

      .page-nav {
        max-width: 640px;
        margin-inline: auto;
      }
    }

    /* ── Page navigator ── */
    .page-nav {
      background: var(--mushaf-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      position: sticky;
      top: 52px;
      z-index: 199;
      gap: 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    html.dark .page-nav {
      background: var(--mushaf-bg);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .page-nav-btn {
      background: rgba(82, 155, 136, 0.12);
      border: 1px solid rgba(82, 155, 136, 0.3);
      color: var(--mushaf-text);
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      min-width: 44px;
    }

    .page-nav-btn:hover:not(:disabled) {
      background: rgba(82, 155, 136, 0.22);
    }

    .page-nav-btn:active {
      transform: scale(0.94);
    }

    .page-nav-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .page-number-display {
      color: var(--mushaf-text);
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      flex: 1;
      cursor: pointer;
    }

    .page-number-display span {
      color: var(--ayah-marker);
      font-weight: 800;
      font-size: 1rem;
    }

    /* ── Go-to-page input ── */
    .goto-bar {
      display: none;
      background: #1A1A1A;
      padding: 8px 14px;
      gap: 8px;
      align-items: center;
    }

    .goto-bar.show {
      display: flex;
    }

    .goto-bar input {
      flex: 1;
      background: #2A2A2A;
      border: 1px solid var(--mushaf-border);
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .goto-bar button {
      background: var(--ayah-marker);
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* ── Main scroll area ── */
    .mushaf-scroll {
      overflow-y: auto;
      padding: 8px 14px;
      padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px));
      min-height: calc(100vh - 110px);
      background: var(--mushaf-bg);
    }

    /* ── Mushaf page (Clean Modern Parchment) ── */
    .mushaf-page {
      background: var(--mushaf-bg);
      border-radius: 0;
      border: none;
      box-shadow: none;
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    .mushaf-page-inner {
      padding: 8px 6px 14px;
      position: relative;
    }

    /* ── Page header (From reference image) ── */
    .mushaf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 12px;
      margin-bottom: 6px;
      direction: ltr;
      border-bottom: none;
    }

    .mushaf-header-surah {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--mushaf-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.2px;
    }

    .mushaf-header-juz {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--mushaf-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.2px;
    }

    /* ── Surah frame — 3 layered SVGs ── */
    .surah-frame-wrap {
      position: relative;
      text-align: center;
      margin: 14px 0 8px;
      direction: rtl;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .surah-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 340px;
      height: auto;
      display: block;
    }

    /* Frame is the base — sets the height of the container */
    .surah-layer-frame {
      position: relative;
      top: auto;
      left: auto;
      transform: none;
    }

    /* سورة label — upper portion of frame */
    .surah-layer-label {
      max-width: 80px;
      top: 28%;
    }

    /* Surah name — center of frame */
    .surah-layer-name {
      max-width: 200px;
      top: 62%;
    }

    /* ── Surah name frame ── */
    .surah-frame {
      text-align: center;
      margin: 10px 0 6px;
      position: relative;
    }

    .surah-frame-inner {
      display: inline-block;
      border: 1.5px solid var(--mushaf-frame);
      border-radius: 6px;
      padding: 6px 24px;
      position: relative;
      background: rgba(201, 162, 77, 0.05);
    }

    /* Side ornaments on surah frame */
    .surah-frame-inner::before,
    .surah-frame-inner::after {
      content: '❧';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mushaf-frame);
      font-size: 1rem;
      opacity: 0.7;
    }

    .surah-frame-inner::before {
      right: 6px;
    }

    .surah-frame-inner::after {
      left: 6px;
      transform: translateY(-50%) scaleX(-1);
    }

    .surah-name {
      font-family: 'KFGQPC Hafs', serif;
      font-size: 1.1rem;
      color: var(--mushaf-header);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .surah-info-small {
      font-size: 0.65rem;
      color: var(--mushaf-muted);
      margin-top: 2px;
    }

    /* ── Basmalah ── */
    .basmalah {
      text-align: center;
      font-family: 'KFGQPC Hafs', serif;
      font-size: 1.3rem;
      color: var(--basmalah-color);
      margin: 8px 0 10px;
      letter-spacing: 1px;
      line-height: 1.8;
    }

    html.dark .basmalah {
      color: var(--mushaf-border);
    }

    /* ── Quran text lines (Clean, High Contrast) ── */
    .mushaf-lines {
      direction: rtl;
    }

    .mushaf-line {
      font-family: 'KFGQPC Hafs', serif;
      font-size: 1.35rem;
      line-height: 2.22;
      color: var(--mushaf-text);
      text-align: justify;
      text-align-last: center;
      width: 100%;
      display: block;
      word-spacing: 0;
    }

    /* Ayah number marker (Signature soft sage-teal circle badge) */
    .ayah-marker {
      display: inline;
      color: var(--ayah-marker);
      font-family: 'KFGQPC Hafs', serif;
      font-size: 1.05em;
      vertical-align: baseline;
      margin: 0 2px;
    }

    /* Surah Al-Fatiha / Al-Ikhlas centered */
    .mushaf-line.center {
      text-align: center;
      text-align-last: center;
    }

    /* ── Page footer (Clean bottom-left number from reference image) ── */
    .mushaf-footer {
      text-align: left;
      padding: 14px 4px 4px;
      margin-top: 10px;
      font-size: 0.92rem;
      color: var(--mushaf-muted);
      font-weight: 500;
      border-top: none;
      direction: ltr;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ── Loading state ── */
    .mushaf-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      gap: 16px;
      color: var(--mushaf-border);
    }

    .mushaf-loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mushaf-border);
      display: inline-block;
      animation: splashDot 1.2s ease-in-out infinite;
      margin: 0 3px;
    }

    .mushaf-loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .mushaf-loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* ── Swipe hint ── */
    .swipe-hint {
      text-align: center;
      color: rgba(201, 162, 77, 0.5);
      font-size: 0.7rem;
      padding: 8px;
      letter-spacing: 1px;
    }

    /* ── Page transition ── */
    .mushaf-page {
      animation: pageAppear 0.3s ease both;
    }

    @keyframes pageAppear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Surah selector modal ── */
    .surah-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9000;
      display: none;
      align-items: flex-end;
      backdrop-filter: blur(3px);
    }

    .surah-modal.show {
      display: flex;
    }

    .surah-modal-box {
      background: var(--card-bg);
      width: 100%;
      max-height: 70vh;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) both;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .surah-modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
    }

    .surah-modal-search {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .surah-modal-search input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
    }

    .surah-modal-list {
      overflow-y: auto;
      flex: 1;
    }

    .surah-modal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .surah-modal-item:active {
      background: rgba(13, 44, 84, 0.08);
    }

    .surah-modal-item .snum {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .surah-modal-item .sname {
      font-weight: 700;
      font-size: 1rem;
      flex: 1;
      padding: 0 10px;
      direction: rtl;
    }

    .surah-modal-item .spage {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── Bookmark ribbon ── */
    .bookmark-ribbon {
      position: absolute;
      top: 0;
      left: 16px;
      width: 22px;
      height: 36px;
      background: #529B88;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
      z-index: 10;
      cursor: pointer;
      opacity: 0.96;
      transition: opacity 0.2s, transform 0.15s;
    }

    .bookmark-ribbon:active {
      transform: scale(0.9);
    }

    .bookmark-ribbon .bk-icon {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #fff;
    }

    /* ── Last read indicator ── */
    .last-read-badge {
      position: absolute;
      top: 0;
      right: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 3px 8px 3px;
      border-radius: 0 0 8px 8px;
      letter-spacing: 0.5px;
      z-index: 10;
      direction: rtl;
    }

    /* ── Bookmark button in header ── */
    .bk-header-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 0.45rem 0.7rem;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .bk-header-btn:active {
      transform: scale(0.9);
    }

    .bk-header-btn.active {
      background: #529B88;
      color: #fff;
    }

    /* ── Bookmarks modal ── */
    .bk-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9500;
      display: none;
      align-items: flex-end;
      backdrop-filter: blur(3px);
    }

    .bk-modal.show {
      display: flex;
    }

    .bk-modal-box {
      background: var(--card-bg);
      width: 100%;
      max-height: 60vh;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) both;
    }

    .bk-modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-weight: 800;
    }

    .bk-list {
      overflow-y: auto;
      flex: 1;
    }

    .bk-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      direction: rtl;
    }

    .bk-item:active {
      background: rgba(13, 44, 84, 0.08);
    }

    .bk-item .bk-pg {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--primary);
      min-width: 40px;
    }

    .bk-item .bk-info {
      flex: 1;
      padding: 0 10px;
    }

    .bk-item .bk-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .bk-item .bk-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .bk-item .bk-del {
      color: #DC2626;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 8px;
      border: none;
      background: #FEE2E2;
      cursor: pointer;
    }

    .bk-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <!-- App Header -->
  <header class="quran-app-header">
    <button class="menu-btn" onclick="history.back()">←</button>
    <div style="text-align:center;">
      <div class="app-title">القرآن الكريم</div>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="bk-header-btn" id="bkBtn" onclick="toggleBookmark()" title="إشارة مرجعية">🔖</button>
      <button class="menu-btn" onclick="openSurahModal()" title="اختر سورة">☰</button>
      <button class="menu-btn" onclick="toggleDarkMode()">
        <img src="icons/day time icon.svg" id="darkToggle"
          style="width:18px;height:18px;filter:brightness(0) invert(1);" alt="">
      </button>
    </div>
  </header>

  <!-- Page Navigator — RTL Arabic book: right button = next, left button = prev -->
  <div class="page-nav">
    <button class="page-nav-btn" id="btnNext" onclick="goPage(currentPage + 1)">‹</button>
    <div class="page-number-display" onclick="toggleGoto()">
      صفحة <span id="pageNum">1</span> <span style="color:#888;font-size:0.75rem;">/ 604</span>
    </div>
    <button class="page-nav-btn" id="btnPrev" onclick="goPage(currentPage - 1)">›</button>
  </div>

  <!-- Go To Page Bar -->
  <div class="goto-bar" id="gotoBar">
    <input type="number" id="gotoInput" min="1" max="604" placeholder="رقم الصفحة (1-604)"
      onkeydown="if(event.key==='Enter') doGoto()" />
    <button onclick="doGoto()">اذهب</button>
  </div>

  <!-- Mushaf Scroll Area -->
  <div class="mushaf-scroll" id="mushafScroll">
    <div class="mushaf-loading" id="loadingState">
      <div style="color:var(--ayah-marker);font-size:0.9rem;margin-bottom:8px;">جاري تحميل المصحف...</div>
      <div>
        <span class="mushaf-loading-dot"></span>
        <span class="mushaf-loading-dot"></span>
        <span class="mushaf-loading-dot"></span>
      </div>
    </div>
    <div id="mushafPage" style="display:none;"></div>
    <div class="swipe-hint">← اسحب للتنقل بين الصفحات →</div>
  </div>

  <!-- Surah Selector Modal -->
  <div class="surah-modal" id="surahModal" onclick="if(event.target===this) closeSurahModal()">
    <div class="surah-modal-box">
      <div class="surah-modal-header">
        <span style="font-weight:800;">اختر سورة</span>
        <button onclick="closeSurahModal()"
          style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:1rem;">✕</button>
      </div>
      <div class="surah-modal-search">
        <input type="text" id="surahSearch" placeholder="ابحث عن سورة..." oninput="filterSurahs(this.value)" />
      </div>
      <div class="surah-modal-list" id="surahList"></div>
    </div>
  </div>

  <!-- Bookmarks Modal -->
  <div class="bk-modal" id="bkModal" onclick="if(event.target===this) closeBkModal()">
    <div class="bk-modal-box">
      <div class="bk-modal-header">
        <span>🔖 الإشارات المرجعية | Bookmarks</span>
        <button onclick="closeBkModal()"
          style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;">✕</button>
      </div>
      <div class="bk-list" id="bkList"></div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/quran.js"></script>
</body>

</html>
